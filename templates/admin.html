<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — STATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d0d0d;
            --surface: #161616;
            --border: #2a2a2a;
            --accent: #c8f04a;
            --text: #f0f0f0;
            --muted: #666;
            --error: #ff5f5f;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
        }

        header .back-btn {
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        header .back-btn:hover { color: var(--accent); }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
        }

        @media (min-width: 768px) {
            .dashboard-container {
                flex-direction: row; 
            }
        }

        .users-section {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .user-list::-webkit-scrollbar { width: 4px; }
        .user-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .user-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 12px;
            animation: popIn 0.2s ease both;
        }
        .user-card:hover { border-color: #444; background: var(--surface); }

        .user-info h2 { font-size: 0.95rem; font-weight: 500; color: var(--text); }
        .user-info p { font-size: 0.75rem; color: var(--muted); }

        .user-actions { display: flex; gap: 0.5rem; }

        .user-actions button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-actions .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
        .user-actions .delete-btn:hover { border-color: var(--error); color: var(--error); }

        .chart-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chart-box {
            width: 100%;
            height: 280px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            padding: 1.5rem;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.98) translateY(4px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>STATION ✦ Admin Station</h1>
        <a href="/contact" class="back-btn">← Back to Chats</a>
    </header>

    <div class="dashboard-container">
        <div class="users-section">
            <h2 class="section-title">// Registered Terminals (Users)</h2>
            <div class="user-list">
                {% for user in users %}
                    <div class="user-card" data-id="{{ user.id }}">
                        <div class="user-info">
                            <h2>{{ user.username }}</h2>
                            <p>{{ user.email }}</p>
                        </div>
                        <div class="user-actions">
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Delete</button>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>

        <div class="chart-section">
            <h2 class="section-title">// Live Platform Traffic</h2>
            <div class="chart-box">
                <canvas id="activityChart" 
                        data-labels="{{ chart_labels | tojson | safe }}"
                        data-users="{{ chart_user_data | tojson | safe }}"
                        data-messages="{{ chart_msg_data | tojson | safe }}">
                </canvas>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.querySelectorAll('.user-card').forEach(card => {
        const deleteBtn = card.querySelector('.delete-btn');
        const editBtn   = card.querySelector('.edit-btn');
        const userId    = card.dataset.id;

        deleteBtn.addEventListener('click', async () => {
            if (!confirm("Are you sure you want to terminate this user session?")) return;

            try {
                const formData = new FormData();
                formData.append('user_id', userId);

                const res = await fetch("/admin/delete-user", {
                    method: 'POST',
                    body: formData
                });
                const response = await res.json();

                if (res.ok && response.success) {
                    card.remove();
                } else {
                    alert(response.message || "Failed to delete user.");
                }
            } catch (err) {
                console.error('Error deleting user:', err);
                alert("An error occurred while deleting the user.");
            }
        });

        editBtn.addEventListener('click', async () => {
            const usernameTag = card.querySelector('.user-info h2');
            const emailTag    = card.querySelector('.user-info p');

            const currentUsername = usernameTag.innerText.trim();
            const currentEmail    = emailTag.innerText.trim();

            const newUsername = prompt("Enter new username:", currentUsername);
            if (newUsername === null) return;

            const newEmail = prompt("Enter new email address:", currentEmail);
            if (newEmail === null) return;

            const trimmedUsername = newUsername.trim();
            const trimmedEmail    = newEmail.trim();

            if (!trimmedUsername || !trimmedEmail) {
                alert("Fields cannot be empty.");
                return;
            }

            if (trimmedUsername === currentUsername && trimmedEmail === currentEmail) {
                alert("No changes detected.");
                return;
            }

            try {
                const formData = new FormData();
                formData.append('user_id', userId);
                formData.append('new_username', trimmedUsername);
                formData.append('new_email', trimmedEmail);

                const res = await fetch("/admin/edit-user", {
                    method: 'POST',
                    body: formData
                });
                const response = await res.json();

                if (res.ok && response.success) {
                    usernameTag.innerText = trimmedUsername;
                    emailTag.innerText    = trimmedEmail;
                    alert("User details updated successfully.");
                } else {
                    alert(response.message || "Failed to update user.");
                }
            } catch (err) {
                console.error('Error editing user:', err);
                alert("An error occurred while updating the user.");
            }
        });
    });

    const chartCanvas = document.getElementById('activityChart');

    const chartLabels      = JSON.parse(chartCanvas.getAttribute('data-labels'));
    const userActivityData = JSON.parse(chartCanvas.getAttribute('data-users'));
    const msgTrafficData   = JSON.parse(chartCanvas.getAttribute('data-messages'));

    const ctx = chartCanvas.getContext('2d');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartLabels,
            datasets: [
                {
                    label: 'Registered Users',
                    data: userActivityData,
                    borderColor: '#c8f04a',
                    backgroundColor: 'rgba(200, 240, 74, 0.05)',
                    borderWidth: 2,
                    tension: 0.4,
                    pointBackgroundColor: '#c8f04a',
                    yAxisID: 'y'
                },
                {
                    label: 'Total Messages',
                    data: msgTrafficData,
                    borderColor: '#f0f0f0',
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    borderDash: [5, 5],
                    tension: 0.4,
                    pointBackgroundColor: '#f0f0f0',
                    yAxisID: 'y1'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        color: '#666',
                        font: { family: 'DM Sans' }
                    }
                }
            },
            scales: {
                x: {
                    grid: { color: '#1f1f1f' },
                    ticks: { color: '#666', font: { family: 'DM Sans' } }
                },
                y: {
                    type: 'linear',
                    position: 'left',
                    grid: { color: '#1f1f1f' },
                    ticks: { color: '#c8f04a' }
                },
                y1: {
                    type: 'linear',
                    position: 'right',
                    grid: { drawOnChartArea: false },
                    ticks: { color: '#666' }
                }
            }
        }
    });
</script>
</body>
</html>
