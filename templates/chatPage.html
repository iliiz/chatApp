<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — STATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d0d0d;
            --surface: #161616;
            --border: #2a2a2a;
            --accent: #c8f04a;
            --text: #f0f0f0;
            --muted: #666;
            --bubble-me: #1e2f0a;
            --bubble-other: #1e1e1e;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .header-info { display: flex; align-items: center; gap: 0.75rem; }

        .header-info h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .chat-target {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            border-left: 2px solid var(--border);
            padding-left: 0.75rem;
        }

        .nav-actions { display: flex; align-items: center; gap: 0.75rem; }

        .back-btn {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        .logout-btn:hover { color: var(--text); border-color: var(--text); }

        /* ── Messages ── */
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            scroll-behavior: smooth;
        }

        .message-list::-webkit-scrollbar { width: 4px; }
        .message-list::-webkit-scrollbar-track { background: transparent; }
        .message-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .message {
            max-width: 70%;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            font-size: 0.93rem;
            line-height: 1.5;
            animation: popIn 0.2s ease both;
            display: flex;
            flex-direction: column;
        }

        .message.me {
            align-self: flex-end;
            background: var(--bubble-me);
            border: 1px solid rgba(200,240,74,0.2);
            border-bottom-right-radius: 2px;
        }

        .message.other {
            align-self: flex-start;
            background: var(--bubble-other);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .message-time {
            font-size: 0.72rem;
            color: var(--muted);
            align-self: flex-end;
            margin-top: 0.3rem;
        }

        /* ── Composer ── */
        .composer {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .composer textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.93rem;
            padding: 0.75rem 1rem;
            resize: none;
            outline: none;
            height: 48px;
            max-height: 160px;
            transition: border-color 0.2s;
            overflow-y: hidden;
        }

        .composer textarea:focus { border-color: var(--accent); }

        .send-btn {
            background: var(--accent);
            color: #0d0d0d;
            border: none;
            border-radius: 10px;
            width: 48px;
            height: 48px;
            font-size: 1.2rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: transform 0.15s, box-shadow 0.15s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(200, 240, 74, 0.3);
        }

        .send-btn:active { transform: scale(0.97); }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(4px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-info">
            <h1>STATION ✦</h1>
            <span class="chat-target">// {{ receiver_user.username }}</span>
        </div>
        <div class="nav-actions">
            <a href="/contact" class="back-btn">← Contacts</a>
            <form action="/logout" method="post" style="margin:0">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </header>

    <div class="message-list" id="messageList">
        <!--
            FIX: messages now come from a single backend query sorted by created_at ASC.
            Previously two separate Jinja loops rendered all sent messages then all received
            messages — so the conversation was always displayed out of chronological order.
        -->
        {% for msg in messages %}
            <div class="message {{ 'me' if msg.sender_id == user.id else 'other' }}">
                <p>{{ msg.content }}</p>
                <!--  FIX: strftime so the timestamp is clean "14:32" not a raw Python datetime repr -->
                <span class="message-time">{{ msg.created_at.strftime('%H:%M') }}</span>
            </div>
        {% endfor %}
    </div>

    <div class="composer">
        <textarea
            id="messageInput"
            placeholder="Type a message…"
            rows="1"
            aria-label="Message input"
        ></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send">↑</button>
    </div>

    <script>
        const messageList  = document.getElementById('messageList');
        const messageInput = document.getElementById('messageInput');
        const sendBtn      = document.getElementById('sendBtn');

        // Scroll to bottom on load
        messageList.scrollTop = messageList.scrollHeight;

        // receiver_id is injected by Jinja so we don't need URLSearchParams
        const receiverId = "{{ receiver_user.id }}";

        // Auto-grow textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
        });

        // Send on Enter, new line on Shift+Enter
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function appendMessage(text, side, time) {
            const el = document.createElement('div');
            el.classList.add('message', side);

            const p = document.createElement('p');
            p.textContent = text;
            el.appendChild(p);

            const timeSpan = document.createElement('span');
            timeSpan.classList.add('message-time');
            timeSpan.textContent = time;
            el.appendChild(timeSpan);

            messageList.appendChild(el);
            messageList.scrollTop = messageList.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Disable input while sending to prevent double-sends
            messageInput.disabled = true;
            sendBtn.disabled = true;

            const formData = new FormData();
            formData.append('message', text);
            formData.append('receiver_id', receiverId);

            try {
                const response = await fetch('/chat', { method: 'POST', body: formData });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();

                if (data.success) {
                    // FIX: use the real created_at returned by the server
                    appendMessage(text, 'me', data.created_at);
                    messageInput.value = '';
                    messageInput.style.height = '48px';
                } else {
                    appendMessage('⚠ Failed to send.', 'other', '');
                }
            } catch (err) {
                appendMessage('⚠ Network error.', 'other', '');
                console.error(err);
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }
    </script>
</body>
</html>
